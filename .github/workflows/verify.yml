name: Verify

on:
  pull_request:
    # Stacked PRs need the same checks before their base reaches main.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'migrations/**'
      - 'docs/database/**'
      - 'api/**'
      - 'prototype/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'knip.json'
      - 'vercel.json'
      - '.vercelignore'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'migrations/**'
      - 'docs/database/**'
      - 'api/**'
      - 'prototype/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'knip.json'
      - 'vercel.json'
      - '.vercelignore'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 24 / full checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify types, build, authorization and UI behavior
        run: npm run check
      - name: Verify CRM with isolated PostgreSQL and concurrent connections
        run: npm run test:crm:postgres
      - name: Verify reproducible generated files
        run: npm run check:reproducible
