<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay｜案件アシスタント 操作サンプル</title>
<style>
:root{--ink:#17332d;--muted:#667770;--green:#18684f;--pale:#eaf2ed;--border:#dce5df;--paper:#f5f7f3;--amber:#956315;--red:#aa493e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}a{color:var(--green)}.shell{display:grid;grid-template-columns:226px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--border);padding:30px 20px;display:flex;flex-direction:column}.brand{font-size:18px;font-weight:750;line-height:1.4;letter-spacing:.03em}.brandmark{display:grid;place-items:center;color:white;background:var(--green);width:35px;height:35px;border-radius:11px;margin-bottom:12px}.side small{font-size:11px;color:var(--muted)}.nav{margin-top:38px;display:grid;gap:7px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;text-align:left;border-radius:9px;font-weight:600}.nav button.active{color:var(--green);background:var(--pale)}.nav button:hover{background:#f1f5f1}.sidefoot{margin-top:auto;padding-top:30px;color:var(--muted);font-size:12px}.avatar{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--pale);border-radius:50%;font-size:11px;font-weight:700;margin-right:7px}.main{min-width:0;padding:0 42px 50px}.top{height:75px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:16px}.crumb{font-size:12px;color:var(--muted)}.demo{font-size:11px;border:1px solid #d2ddce;border-radius:20px;padding:5px 12px;color:#5b7157;background:#eef3e9}.head{display:flex;align-items:flex-end;justify-content:space-between;margin:31px 0 25px;gap:18px}.eyebrow{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.14em}.head h1{margin:7px 0 8px;font-size:30px;line-height:1.35;letter-spacing:.02em}.sub{color:var(--muted);margin:0;font-size:13px}.btn{border:1px solid var(--border);background:white;color:var(--ink);border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600}.btn:hover{background:#edf4ef}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.primary:hover{background:#10543e}.btn.text{background:transparent;border:0;color:var(--green);padding:5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--border);padding:18px 22px;border-radius:12px}.stat label{font-size:12px;color:var(--muted)}.stat .number{font-size:32px;line-height:1.4;font-weight:650;margin:7px 0}.stat .number small{font-size:13px;font-weight:400;margin-left:6px}.stat .hint{font-size:11px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:23px}.section-title{font-size:16px;margin:0 0 15px;font-weight:700}.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:22px}.focus{background:#edf4ee;border-color:#d3e3d6}.focus h2{font-size:16px;margin:8px 0 12px}.focus p{font-size:12px;color:#496157;margin:8px 0}.rule{border-top:1px solid #d3e3d6;margin-top:17px;padding-top:15px}.note{font-size:12px;color:var(--muted);margin:15px 0}.taskcard{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:12px;padding:19px 21px;display:flex;gap:16px;align-items:flex-start}.index{width:28px;height:28px;border:1px solid var(--border);border-radius:8px;display:grid;place-items:center;flex-shrink:0;color:var(--muted);font-size:11px}.taskbody{flex:1;min-width:0}.casecaption{font-size:11px;color:var(--muted)}.taskcard h3{font-size:15px;line-height:1.6;margin:6px 0}.taskcard p{font-size:12px;color:var(--muted);margin:5px 0 10px}.tag{display:inline-block;font-size:11px;line-height:1.7;padding:2px 8px;border-radius:5px;background:#eef2ed;color:#51655a;white-space:nowrap}.tag.red{background:#f9e9e5;color:var(--red)}.tag.amber{background:#faf0da;color:var(--amber)}.tag.green{background:var(--pale);color:var(--green)}.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}.tools{display:flex;gap:10px;margin-bottom:19px}.tools input{flex:1;min-width:0}.tools input,select,textarea{border:1px solid var(--border);border-radius:8px;background:white;padding:10px 12px;color:var(--ink)}.tools select{max-width:180px}.tablewrap{overflow:auto;background:white;border:1px solid var(--border);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:730px;text-align:left}th{background:#f8faf7;color:var(--muted);font-weight:500;font-size:11px;padding:14px 18px}td{padding:18px;border-top:1px solid var(--border);font-size:12px;vertical-align:top}td strong{font-size:14px}.statusdot{display:inline-block;width:7px;height:7px;background:#57a382;border-radius:50%;margin-right:5px}.reviewcard{max-width:940px}.diff{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:18px 0}.diff>div{padding:16px;background:#f6f7f4;border-radius:9px}.diff .after{background:#edf5ef}.diff small{color:var(--muted)}.diff p{font-size:14px;font-weight:600;margin:8px 0}.evidence{border-left:3px solid #bad0bd;background:#f7faf6;padding:13px 17px;margin:14px 0;font-size:13px}.evidence small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.check{padding:12px 15px;border:1px solid #eddfb8;background:#fffaf0;border-radius:8px;font-size:12px;color:#846522}.empty{padding:38px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;background:white}.empty strong{display:block;font-size:18px;color:var(--ink);margin-bottom:10px}.upload{padding:32px;text-align:center;background:#f8faf6;border:1px dashed #bbcdbb;border-radius:11px;margin:20px 0}.upload h3{margin:10px 0;font-size:17px}.upload p{font-size:12px;color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.step{padding:15px;background:#fff;border:1px solid var(--border);border-radius:9px;font-size:12px}.step b{display:block;color:var(--green);font-size:11px;margin-bottom:8px}.arch{display:grid;grid-template-columns:1fr 1fr;gap:18px}.arch .panel h3{margin:4px 0 10px;font-size:16px}.arch .panel p{color:var(--muted);font-size:13px}.flow{display:flex;align-items:center;justify-content:center;gap:13px;padding:26px 15px;flex-wrap:wrap}.flow span{background:var(--pale);padding:12px 17px;border-radius:8px;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:30;box-shadow:0 8px 30px #17332d25;background:var(--ink);color:white;padding:12px 22px;border-radius:10px;font-size:13px;max-width:85vw;display:none}.toast.visible{display:block}dialog{border:0;border-radius:16px;padding:0;max-width:740px;width:calc(100vw - 32px);max-height:90vh;box-shadow:0 30px 100px #11291e35;color:var(--ink)}dialog::backdrop{background:#15312b55;backdrop-filter:blur(2px)}.dialogtop{position:sticky;top:0;background:#fff;padding:22px 26px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:1}.dialogtop h2{font-size:22px;margin:0}.dialogbody{padding:25px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.detailgrid>div{background:#f6f8f4;border-radius:9px;padding:13px}.detailgrid small{display:block;color:var(--muted);font-size:11px}.detailgrid b{font-size:13px}.timeline{margin:18px 0 25px}.timeline p{font-size:13px;border-left:2px solid #dbe7dc;padding:0 0 15px 15px;margin:0}.timeline small{display:block;color:var(--muted);font-size:11px}.reportbox{border-top:1px solid var(--border);padding-top:19px}textarea{width:100%;resize:vertical;min-height:90px;margin:9px 0}.footnote{font-size:11px;color:var(--muted);margin-top:22px}.hide{display:none!important}.introline{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:17px}.pillcount{border-radius:20px;background:white;min-width:22px;text-align:center;font-size:11px}.live{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:12px;white-space:pre-wrap}.close{font-size:18px;line-height:1;padding:9px 12px}.mobilebrand{display:none}.smallheading{font-size:13px;margin:20px 0 10px}
@media(min-width:1500px){.main{max-width:1450px;width:100%;margin:auto}}
@media(max-width:1100px){.main{padding:0 25px 35px}.layout{grid-template-columns:1fr}.asidebox{display:none}.shell{grid-template-columns:195px 1fr}.side{padding:25px 15px}.head h1{font-size:27px}}
@media(max-width:700px){.shell{display:block}.side{position:static;height:auto;padding:14px 17px;border-right:0;border-bottom:1px solid var(--border)}.brand{font-size:15px;display:flex;align-items:center;gap:10px}.brandmark{width:28px;height:28px;margin:0}.brand small{display:none}.nav{display:flex;margin-top:13px;gap:3px;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px;font-size:12px;gap:7px}.sidefoot{display:none}.main{padding:0 17px 30px}.top{height:55px}.crumb{font-size:10px}.demo{font-size:9px;padding:4px 8px}.head{margin:23px 0 20px;align-items:flex-start}.head h1{font-size:25px}.head>.btn{font-size:11px;padding:8px 10px}.sub{font-size:11px}.stats{gap:8px}.stat{padding:13px 11px}.stat .number{font-size:27px}.stat .hint{font-size:10px}.stat label{font-size:11px}.taskcard{padding:16px 14px;gap:10px}.taskcard h3{font-size:14px}.taskcard p{font-size:11px}.index{width:23px;height:23px}.tools{gap:7px}.tools select{max-width:117px;font-size:12px}.tools input{font-size:12px}.diff,.arch{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.panel{padding:18px}.detailgrid{gap:8px}.dialogbody{padding:19px}.cardfoot{align-items:flex-start}.cardfoot>.row{gap:5px}.introline{align-items:flex-start}.introline .note{font-size:10px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
 <div class="brand"><div class="brandmark" aria-hidden="true">⌂</div><div>Relay<br><small>案件アシスタント</small></div></div>
 <nav class="nav" aria-label="メインメニュー">
  <button data-page="today" class="active">今日の対応 <span aria-hidden="true">↗</span></button>
  <button data-page="cases">案件一覧 <span id="navCaseCount" class="pillcount">5</span></button>
  <button data-page="reviews">更新案の確認 <span id="navReviewCount" class="pillcount">1</span></button>
  <button data-page="imports">情報を取り込む <span aria-hidden="true">＋</span></button>
  <button data-page="design">仕組みを見る <span aria-hidden="true">○</span></button>
 </nav>
 <div class="sidefoot"><div><span class="avatar">管</span>管理者として表示</div><p>Relay / 社内用<br>設計サンプル v1.0</p></div>
</aside>
<main class="main">
 <header class="top"><span class="crumb">チームの仕事を、次の一歩へ。</span><span class="demo">操作サンプル · 架空データ・外部接続なし</span></header>
 <div id="content"></div>
</main>
</div>
<dialog id="detail" aria-labelledby="detailTitle"><div class="dialogtop"><div><div class="eyebrow">CASE DETAIL</div><h2 id="detailTitle"></h2></div><button class="btn close" id="closeDetail" aria-label="案件詳細を閉じる">×</button></div><div id="detailContent" class="dialogbody"></div></dialog>
<dialog id="evidenceDialog" aria-labelledby="evidenceTitle"><div class="dialogtop"><h2 id="evidenceTitle">元の発言</h2><button class="btn close" id="closeEvidence" aria-label="元の発言を閉じる">×</button></div><div class="dialogbody"><p class="note">画面確認用の架空の会話です。</p><div class="evidence"><small>業務LINE（サンプル） / 9月11日 10:20 / 担当A</small>お客様に確認しました。9月18日15時の現調で大丈夫です。工事会社への確定連絡はこれからです。</div><div class="check">顧客への確認は完了。工事会社への連絡は残っています。</div></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const originalCases=[
 {id:1,name:'顧客A様',area:'大分市',stage:'工事調整',title:'現調候補日をお客様に確認する',owner:'担当A',waiting:'顧客',due:'本日 17:00',level:'today',status:'対応中',reason:'施工会社から日程候補あり。お客様の了承を確認し、施工会社へ折り返します。',next:'9月18日 15:00 · 現調候補',evidence:'9/10 16:30　施工会社より「9/18 15時でいかがでしょうか」。',history:[['9/08','現調の日程調整を開始。'],['9/10 16:30','施工会社から9/18 15時の候補を受領。'],['9/10 17:00','担当Aが「お客様に確認して折り返します」と報告。']],notes:[]},
 {id:2,name:'顧客B様',area:'宮崎市',stage:'商談調整',title:'変更後の日程で前確認をする',owner:'担当B',waiting:'—',due:'本日中',level:'today',status:'未着手',reason:'商談日が変更されています。前回の前確認は変更前の日程に対するものです。',next:'9月12日 10:00 · 商談予定',evidence:'9/10 18:00　「商談は9/12 10時へ変更になりました」。',history:[['9/05','初回の日程で前確認済み。'],['9/10 18:00','顧客都合で9/12 10時へ変更。'],['9/11','変更後の前確認は記録なし。']],notes:[]},
 {id:3,name:'顧客C様',area:'別府市',stage:'契約後対応',title:'不足書類の提出状況を確認する',owner:'担当A',waiting:'顧客',due:'9月14日',level:'upcoming',status:'相手待ち',reason:'仮審査は受付済み。必要書類の提出が確認できるまで「審査中」へ進めません。',next:'審査開始日 · 未定',evidence:'9/09 11:00　「受付は済んでいますが、源泉徴収票の提出待ちです」。',history:[['9/07','銀行へ申込。'],['9/09','源泉徴収票の不足が判明。'],['9/10','顧客へ提出方法を案内。']],notes:[]},
 {id:4,name:'顧客D様',area:'日向市',stage:'工事調整',title:'再工事の候補日を複数確認する',owner:'担当C',waiting:'顧客',due:'9月10日',level:'overdue',status:'対応中',reason:'対応期限を過ぎています。電話で確認済みの場合は、その結果を記録してください。',next:'再工事日 · 未定',evidence:'9/08 14:00　「9/10までにお客様の休日を確認します」。',history:[['9/06','屋内作業が残り、再工事が必要に。'],['9/08','顧客の休日を確認することを担当Cが報告。']],notes:[]},
 {id:5,name:'顧客E様',area:'鹿児島市',stage:'商談調整',title:'次回連絡の担当者と期限を決める',owner:'未設定',waiting:'—',due:'未設定',level:'unknown',status:'未着手',reason:'日程未定でも案件を残しています。次に連絡する人と期限を設定してください。',next:'商談日 · 未定',evidence:'9/10 19:00　「来月以降の商談を希望。日程はこれから相談」。',history:[['9/10','来月以降の相談希望を受領。担当と連絡期限は未設定。']],notes:[]}
];
let cases=structuredClone(originalCases),page='today',reviewState='pending',sampleImported=false,activeCase=null;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const openCases=()=>cases.filter(c=>c.status!=='完了');
function toast(s){$('toast').textContent=s;$('toast').classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('visible'),4200)}
function header(k,title,sub,button=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${button}</div>`}
function badge(c){return `<span class="tag ${c.level==='overdue'?'red':c.level==='today'?'amber':''}">${esc(c.due)}</span>`}
function card(c,i){return `<article class="taskcard"><span class="index">${String(i+1).padStart(2,'0')}</span><div class="taskbody"><div class="row"><span class="casecaption">${esc(c.name)} · ${esc(c.area)} / ${esc(c.stage)}</span>${badge(c)}</div><h3>${esc(c.title)}</h3><p>${esc(c.reason)}</p><div class="cardfoot"><div class="row"><span class="tag">${esc(c.owner)}</span><span class="tag">${esc(c.status)}</span></div><button class="btn text" data-case="${c.id}">案件を確認 →</button></div></div></article>`}
function today(){const all=openCases(),urgent=all.filter(c=>['today','overdue'].includes(c.level)).sort((a,b)=>(a.level==='overdue'?-1:1)-(b.level==='overdue'?-1:1));return header('FRIDAY, SEPTEMBER 11','今日の対応','9月11日（金）· 次に進めるための仕事が、ここにまとまっています。','<button class="btn" data-go="imports">＋ 情報を取り込む</button>')+`<div class="stats"><div class="stat"><label>今日までの対応</label><div class="number">${urgent.length}<small>件</small></div><div class="hint">担当者の確認が必要な仕事</div></div><div class="stat"><label>対応期限を超過</label><div class="number" style="color:var(--red)">${all.filter(c=>c.level==='overdue').length}<small>件</small></div><div class="hint">記録上の期限を過ぎています</div></div><div class="stat"><label>担当・期限の確認</label><div class="number">${all.filter(c=>c.level==='unknown').length}<small>件</small></div><div class="hint">次の動きを決める案件</div></div></div><div class="layout"><section><div class="introline"><h2 class="section-title">まず、この仕事から</h2><span class="note" style="margin:0">情報基準：9/11 10:30（サンプル）</span></div>${urgent.length?urgent.map(card).join(''):'<div class="empty"><strong>今日までの対応は完了しました</strong>案件一覧から、次の予定も確認できます。</div>'}<p class="note">電話で対応済みのものは、案件から結果を記録してください。</p></section><aside class="asidebox"><div class="panel focus"><div class="eyebrow">ASSISTANT NOTE</div><h2>日程の了承のあとにも、<br>次の仕事があります。</h2><p>お客様が了承したら、工事会社への確定連絡を残します。返信だけで案件を完了にしません。</p><div class="rule"><p>確認待ちの更新案</p><button class="btn" data-go="reviews">${reviewState==='pending'?'1件の更新案を見る':'確認結果を見る'} →</button></div></div><p class="note">表示は取得済みの会話と担当者の記録に基づきます。記録がない作業を、未対応と断定しません。</p></aside></div>`}
function caseRows(q='',owner='all'){return cases.filter(c=>(owner==='all'||c.owner===owner)&&`${c.name} ${c.area} ${c.title}`.includes(q)).map(c=>`<tr><td><button class="btn text" data-case="${c.id}"><strong>${esc(c.name)}</strong></button><br><span class="casecaption">${esc(c.area)}</span></td><td><span class="statusdot"></span>${esc(c.stage)}</td><td>${esc(c.title)}<br><span class="casecaption">${esc(c.status)} · 待ち相手：${esc(c.waiting)}</span></td><td>${esc(c.owner)}</td><td>${badge(c)}</td></tr>`).join('')||'<tr><td colspan="5">条件に合う案件はありません。</td></tr>'}
function list(){return header('CASES','案件一覧','日程が未定でも、次の対応を残しておけます。')+`<div class="tools"><input id="search" type="search" placeholder="顧客名・エリア・対応内容で検索" aria-label="案件を検索"><select id="owner" aria-label="担当者で絞り込み"><option value="all">すべての担当者</option><option>担当A</option><option>担当B</option><option>担当C</option><option>未設定</option></select></div><div class="tablewrap"><table><thead><tr><th>お客様</th><th>進行段階</th><th>次の対応</th><th>社内担当</th><th>対応期限</th></tr></thead><tbody id="caseRows">${caseRows()}</tbody></table></div><p class="footnote">このサンプルでは各案件の代表タスクを表示しています。本番は複数の並行タスクを管理します。</p>`}
function reviews(){return header('REVIEW','更新案の確認','元の発言と変更内容を見て、案件に反映します。')+(reviewState!=='pending'?`<div class="empty"><strong>${reviewState==='approved'?'更新案を反映しました':'更新案を却下しました'}</strong><p>今回の確認待ちはありません。</p><button class="btn" data-case="1">顧客A様の案件を見る →</button></div>`:`<div class="panel reviewcard"><div class="row" style="justify-content:space-between"><div><span class="tag green">新しい発言から作成</span><h2 style="font-size:20px;margin:10px 0 0">顧客A様 · 現調日の確認</h2></div><span class="casecaption">9/11 10:20の報告</span></div><div class="diff"><div><small>これまでの状態</small><p>お客様に現調候補日を確認する</p><span class="tag">顧客の回答待ち</span></div><div class="after"><small>変更する内容</small><p>工事会社へ現調日の確定連絡</p><span class="tag green">お客様は了承済み</span></div></div><div class="evidence"><small>元の発言（サンプル） / 担当A</small>「お客様に確認しました。9月18日15時の現調で大丈夫です。工事会社への確定連絡はこれからです。」</div><button class="btn text" id="showEvidence">元の発言を開く ↗</button><div class="detailgrid"><div><small>次の担当者</small><b>担当A（この画面で確認）</b></div><div><small>対応期限</small><b>本日17:00（この画面で確認）</b></div></div><div class="check">工事会社の了承を確認するまで、現調日は「候補」のままです。担当者・期限を含めて確認してから反映します。</div><div class="row" style="margin-top:20px"><button class="btn primary" id="approve">この内容で反映する</button><button class="btn" id="reject">この更新案を却下</button></div><p class="footnote">画面の反映だけを体験できます。工事会社への連絡は送信されません。</p></div>`)}
function imports(){return header('IMPORT','情報を取り込む','LINEの書き出し履歴から、案件ごとの更新案をつくります。')+`<div class="panel reviewcard"><span class="tag green">最初のリリース：TXT取込</span><div class="upload"><div style="font-size:28px;color:var(--green)">↥</div><h3>業務LINEの履歴を取り込む</h3><p>本番ではTXTを選び、会話グループと基準日を指定します。<br>このサンプルでは架空の取込結果を表示します。</p><button class="btn primary" id="sampleImport">${sampleImported?'サンプル結果を表示中':'サンプルの取込結果を見る'}</button></div><div class="steps"><div class="step"><b>01 · 受け取る</b>会話と期間を確認</div><div class="step"><b>02 · 整理する</b>重複・秘密情報を除外</div><div class="step"><b>03 · 案件を探す</b>同姓は確認へ回す</div><div class="step"><b>04 · 確認する</b>変更案と根拠を表示</div></div>${sampleImported?`<div class="check">サンプル表示です。ファイルの読み込みやAI解析は実行していません。</div><div class="detailgrid"><div><small>履歴名</small><b>業務LINE_サンプル.txt</b></div><div><small>情報の基準日</small><b>2026年9月11日</b></div><div><small>同じ投稿</small><b>2件を重複として整理</b></div><div><small>新しい発言</small><b>1件 → 更新案1件</b></div></div><button class="btn" data-go="reviews">更新案の確認へ →</button>`:''}<p class="note">過去の履歴はまず当時の状態を再現し、現在も動いている案件を確認してから運用を開始します。</p></div>`}
function design(){return header('HOW IT WORKS','Vercelで動く、案件アシスタント','画面とAPIをVercelへ。案件の記憶と長い処理は専用サービスへ。')+`<div class="panel"><div class="flow"><span>LINE履歴・電話メモ</span>→<span>根拠付きの更新案</span>→<span>担当者が確認</span>→<span>案件台帳・今日の対応</span></div></div><div class="arch" style="margin-top:20px"><div class="panel"><div class="eyebrow">01 / APPLICATION</div><h3>Next.js × Vercel</h3><p>スマートフォンとPCから使う画面、ログイン後の操作、取込受付を担当します。本番は業務用プランを想定。</p></div><div class="panel"><div class="eyebrow">02 / MEMORY</div><h3>Supabase</h3><p>案件・担当・期限・元の発言を保存。認証と組織ごとのアクセス制御、非公開ファイル保管もまとめます。</p></div><div class="panel"><div class="eyebrow">03 / BACKGROUND WORK</div><h3>Inngest</h3><p>長い履歴を小分けに処理。途中で失敗しても続きから再開し、朝夕の対応一覧を作成します。</p></div><div class="panel"><div class="eyebrow">04 / EXTRACTION</div><h3>Claude API</h3><p>会話から事実と次の対応を抽出します。担当や日付が曖昧なら確認へ回し、根拠のない完了を作りません。</p></div></div><div class="panel" style="margin-top:20px"><h3 style="margin-top:0">小さく始める順序</h3><p class="sub">案件台帳 → TXT取込と更新案 → 期限の注意表示 → 10案件で試行 → LINEまたはSlack連携 → カレンダー連携</p><p class="note">最初は案件進行に集中。ローン試算・補助金判定・KPI集計は、その後の追加機能です。</p><a href="../docs/DESIGN.md">画面・データ・AI処理・運用の詳細設計書を開く ↗</a></div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});$('navReviewCount').textContent=reviewState==='pending'?'1':'0';$('navCaseCount').textContent=cases.length;$('content').innerHTML=({today,cases:list,reviews,imports,design}[page])();if(page==='cases'){const filter=()=>$('caseRows').innerHTML=caseRows($('search').value,$('owner').value);$('search').addEventListener('input',filter);$('owner').addEventListener('change',filter)}}
function navigate(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function openCase(id){activeCase=cases.find(c=>c.id===id);fillDetail();if(!$('detail').open)$('detail').showModal()}
function fillDetail(){const c=activeCase;$('detailTitle').textContent=c.name;$('detailContent').innerHTML=`<div class="row"><span class="tag green">${esc(c.stage)}</span><span class="tag">${esc(c.area)}</span><span class="tag">${esc(c.status)}</span></div><h3 style="margin:20px 0 8px;font-size:19px">${esc(c.title)}</h3><p class="sub">${esc(c.reason)}</p><div class="detailgrid"><div><small>社内の担当者</small><b>${esc(c.owner)}</b></div><div><small>対応期限</small><b>${esc(c.due)}</b></div><div><small>待っている相手</small><b>${esc(c.waiting)}</b></div><div><small>次の予定</small><b>${esc(c.next)}</b></div></div><h3 class="smallheading">これまでの経緯</h3><div class="timeline">${c.history.map(h=>`<p><small>${esc(h[0])}</small>${esc(h[1])}</p>`).join('')}</div><h3 class="smallheading">この対応の根拠</h3><div class="evidence"><small>業務LINE / 画面確認用の架空データ</small>${esc(c.evidence)}</div>${c.notes.length?`<h3 class="smallheading">担当者の対応記録</h3>${c.notes.map(n=>`<div class="evidence"><small>本人報告 · サンプル操作</small>${esc(n)}</div>`).join('')}`:''}<div class="reportbox"><h3 class="smallheading" style="margin-top:0">電話などで進んだ仕事を記録</h3><label class="sub" for="report">対応内容・相手の回答</label><textarea id="report" placeholder="例：お客様へ電話。候補日で了承。工事会社への連絡はこれから。"></textarea><div class="row"><button class="btn primary" id="saveReport">対応メモを保存</button><button class="btn" id="completeTask" ${c.status==='完了'?'disabled':''}>${c.status==='完了'?'このタスクは完了済み':'このタスクを完了にする'}</button></div><p class="footnote">完了には具体的な対応結果の入力が必要です。メモの保存だけでは、予定や他のタスクを変更しません。</p></div><button class="btn" id="handoff">引き継ぎを作成する</button><div id="handoffBox" class="hide" style="margin-top:15px"><div id="handoffText" class="live"></div><button class="btn text" id="copyHandoff">引き継ぎ文をコピー</button></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);if(b.dataset.go)navigate(b.dataset.go);if(b.dataset.case)openCase(Number(b.dataset.case));if(b.id==='closeDetail')$('detail').close();if(b.id==='closeEvidence')$('evidenceDialog').close();if(b.id==='showEvidence')$('evidenceDialog').showModal();if(b.id==='sampleImport'){sampleImported=true;render();toast('サンプルの取込結果を表示しました。')}if(b.id==='approve'){const c=cases.find(x=>x.id===1);reviewState='approved';c.title='工事会社へ現調日の確定連絡';c.waiting='—';c.status='未着手';c.owner='担当A';c.due='本日 17:00';c.reason='お客様は現調候補日を了承済み。工事会社へ確定連絡を行い、返答を確認します。';c.evidence='9/11 10:20　「お客様は9/18 15時で了承。工事会社への確定連絡はこれからです」。';c.history.push(['9/11 10:20','顧客から了承を取得。工事会社への連絡タスクに切り替え。']);render();toast('更新案を反映しました。次の連絡タスクが残っています。')}if(b.id==='reject'){reviewState='rejected';render();toast('更新案を却下しました。案件の状態は変更していません。')}if(b.id==='saveReport'||b.id==='completeTask'){const t=$('report').value.trim();if(t.length<5){toast('具体的な対応結果を5文字以上で入力してください。');$('report').focus();return}activeCase.notes.push(t);if(b.id==='completeTask'){activeCase.status='完了';activeCase.reason='担当者の対応報告により、このタスクを完了しました。案件全体の完了ではありません。';activeCase.history.push(['サンプル操作','担当者の報告により、表示中のタスクを完了。'])}fillDetail();render();toast(b.id==='saveReport'?'対応メモを保存しました。予定・状態は変更していません。':'このタスクを完了にしました。')}if(b.id==='handoff'){const c=activeCase;const t=`【${c.name} 引き継ぎ】\n進行段階：${c.stage}\n現在のタスク：${c.title}\nタスク状態：${c.status}\n担当者：${c.owner}\n待ち相手：${c.waiting}\n対応期限：${c.due}\n予定：${c.next}\n根拠：${c.evidence}\n担当者の最新報告：${c.notes.at(-1)||'記録なし'}\n\n※取得済みの記録に基づくサンプルです。`; $('handoffText').textContent=t;$('handoffBox').classList.remove('hide')}if(b.id==='copyHandoff'){try{await navigator.clipboard.writeText($('handoffText').textContent);toast('引き継ぎ文をコピーしました。送信はしていません。')}catch{toast('自動コピーできませんでした。表示された文章を選択してコピーしてください。')}}});
$('detail').addEventListener('click',e=>{if(e.target===$('detail'))$('detail').close()});$('evidenceDialog').addEventListener('click',e=>{if(e.target===$('evidenceDialog'))$('evidenceDialog').close()});
render();
</script>
</body>
</html>
